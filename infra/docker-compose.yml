# Local dev stack: Postgres + the API. Redis joins in Phase 2 for search caching and rate limits.
#   docker compose -f infra/docker-compose.yml up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: movielink
      POSTGRES_PASSWORD: movielink
      POSTGRES_DB: movielink
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movielink"]
      interval: 2s
      retries: 30
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5080
      ConnectionStrings__MovieLink: Host=db;Database=movielink;Username=movielink;Password=movielink
    ports: ["5080:5080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
